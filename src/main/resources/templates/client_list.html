<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>sqrt3's Multiple Screen Viewer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    .card-img-top:hover {
      transform: scale(1.1);
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .modal-content img {
      width: 100%;
      max-width: 100vw;
      max-height: 80vh;
      object-fit: contain;
      margin: auto;
    }

    .modal-dialog {
      max-width: 100%;
      width: auto;
      height: auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      width: auto;
      max-width: 90%;
      margin: auto;
    }
  </style>
  <script>
    function updateAllClients() {
      fetch('/api/clients', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' }
      })
      .then(response => response.json())
      .then(data => {
        alert(data.message);
      })
      .catch(error => {
        console.error('Error:', error);
        alert('Error occurred while updating all clients.');
      });
    }

    function updateClientStatus(clientName) {
      const formData = new FormData();
      formData.append('status', 'true');

      fetch(`/api/clients/${clientName}/status`, {
        method: 'PUT',
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        alert(data.message);
      })
      .catch(error => {
        console.error('Error:', error);
        alert(`Error occurred while updating client ${clientName}.`);
      });
    }
  </script>
</head>
<body>
<div class="container">
  <div class="d-flex justify-content-between">
    <button class="btn btn-success" th:text="'Total Clients: ' + ${clients.size()}" disabled></button>
    <button class="btn btn-primary" onclick="updateAllClients()">Update All</button>
  </div>

  <div class="row">
    <div class="col-sm-6" th:each="client : ${clients}">
      <div class="card">
        <img th:src="@{/{name}.png(name=${client.getName()})}" class="card-img-top" alt="Image 1" data-bs-toggle="modal" data-bs-target="#imageModal">
        <h5 class="card-title" th:text="'ID: ' + ${client.getId()}"></h5>
        <p class="card-text" th:text="'Updated: ' + ${client.getUpdatedTime()}"></p>
        <p class="card-text" th:text="'Name: ' + ${client.getName()}"></p>
        <button class="btn btn-success" type="button" th:attr="onclick='updateClientStatus(\'' + ${client.getName()} + '\')'">Update</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <img src="" alt="Large Image" id="modalImage">
    </div>
  </div>
</div>

<script>
  const modalImage = document.getElementById('modalImage');
  const images = document.querySelectorAll('.card-img-top');

  images.forEach(image => {
    image.addEventListener('click', function () {
      modalImage.src = image.src;
    });
  });
</script>
</body>
</html>
