<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>sqrt3's Multiple Screen Viewer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
</head>
<body>
<div class="container">
  <p th:text="'Total Clients: ' + ${clients.size()}"></p>
  <div class="row">
    <div class="col-sm-6" th:each="client : ${clients}">
      <p th:text="'ID: ' + ${client.getId()}"></p>
      <p th:text="'Updated: ' + ${client.getUpdatedTime()}"></p>
      <div class="card">
        <img th:src="@{/{name}.png(name=${client.getName()})}" class="card-img-top" alt="Image 1">
      </div>
    </div>
  </div>
</div>
</body>
</html>
